experiment_name: "exp3_1fp_optimal_eta"

seed: 0
n_samples: 1000000
history_window: 1

env:
  n_makers: 2
  n_episodes: 100000
  n_rounds: 100000
  epsilon: 0.001

generator:
  _target_: "lama_lab.generators.GaussianMixtureGenerator"
  weights: [1.0]
  means: [0.5]
  stds: [0.1]
  low: 0.0
  high: 1.0

agent:
  _target_: "lama_lab.agents.AgentExp3"
  # sqrt(2 * ln(K) / (T * K)) with K = 15 arms and T = 100000 rounds
  eta: 0.002
  gamma: 0.0
  # Quotes and V both lie in [0, 1], so a gap is in [-1, 1]
  reward_range: [-1.0, 1.0]
  action_space:
    _target_: "lama_lab.analysis.build_quote_grid"
    low: 0.0
    high: 1.0
    delta: 0.2
    epsilon: 0.001

diagnostics:
  n_diag_episodes: 64
  checkpoints: null
