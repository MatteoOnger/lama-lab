experiment_name: "sanity_check"

n_samples: 10000
history_window: 2

env:
  n_makers: 2
  n_episodes: 100
  n_rounds: 10000
  epsilon: 0.001

generator:
  _target_: "lama_lab.generators.GaussianMixtureGenerator"
  weights: [1.0]
  means: [0.5]
  stds: [0.1]
  low: 0.0
  high: 1.0

agent:
  _target_: "lama_lab.agents.AgentPZOMD"
  init_x: [0.0, 1.0]
  delta_0: 0.5
  eta_0: 0.1
  decay_delta: 0.25
  decay_eta: 0.75
  min_delta: 0.001
  min_eta: 0.001
  max_grad_norm: 5.0  
  project_fn:
    _target_: "lama_lab.projectors.MarketMakingProjector"
    low: 0.0
    high: 1.0
    epsilon: 0.001