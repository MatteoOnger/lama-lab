experiment_name: "exp3_1fp"

seed: 0
n_samples: 1000000
history_window: 1

env:
  n_makers: 2
  n_episodes: 100000
  n_rounds: 100000
  epsilon: 0.001

generator:
  _target_: "lama_lab.generators.GaussianMixtureGenerator"
  weights: [1.0]
  means: [0.5]
  stds: [0.1]
  low: 0.0
  high: 1.0

agent:
  _target_: "lama_lab.agents.AgentExp3"
  eta: 0.005
  gamma: 0.0
  # [-(high - low) + delta, (high - low) / 2]: the executing side pays at most
  # half the spread, and loses at most the whole range less one tick. Keep this
  # tight, a loose bound wastes the loss range on a constant that does not
  # cancel under bandit feedback.
  reward_range: [-0.8, 0.5]
  action_space:
    _target_: "lama_lab.analysis.build_quote_grid"
    low: 0.0
    high: 1.0
    delta: 0.2
    epsilon: 0.001

diagnostics:
  n_diag_episodes: 64
  checkpoints: null
