[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lama-lab"
version = "0.1.0"
description = "Research framework for simulating and analyzing multi-agent learning dynamics in economic markets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "dill",
  "ipykernel",
  "ipympl",
  "ipywidgets",
  "matplotlib",
  "numpy",
  "scipy>=1.18.0",
  "torch",
]

[project.optional-dependencies]
dev = [
  "black",
  "pytest",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lama_lab*"]
